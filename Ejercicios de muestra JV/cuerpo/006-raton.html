<!doctype html>
<html>
  <head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="../../img/logo-claro.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="../../img/logo-oscuro.png" type="image/png" media="(prefers-color-scheme: dark)">

</head>
  <body class="mv-ej">
    <header class="mv-ej-cabecera"><img src="../../img/logo-oscuro.png" alt="Logo de Sara Monzó"><span class="marca">smf | interfaz integrada</span><h1>Coordenadas del ratón</h1><a class="mv-ej-volver" href="../index.html">← Ejercicios</a><button class="mv-tema" type="button" data-cambiar-tema><svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></header>
    <main class="mv-ej-raton mv-ej-ejes"><output id="coordenadas">x: 0 · y: 0<small>Mueve el ratón: el origen (0, 0) está en el centro</small></output></main>
    <script>
      console.log("hola");
			let anchura = window.innerWidth
      let altura = window.innerHeight;
      let centrox = anchura/2
      let centroy = altura/2
      let cuerpo = document.querySelector("html");

      cuerpo.onmousemove = function(e){
        let x = 0-centrox+e.clientX
        let y = 0+centroy-e.clientY
        console.log(x, y);
        document.querySelector("#coordenadas").firstChild.textContent = `x: ${x} · y: ${y}`;
      };
    </script>
  </body>
