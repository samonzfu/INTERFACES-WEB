<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>smf | interfaz integrada</title>
  <link rel="icon" href="img/logo-claro.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="img/logo-oscuro.png" type="image/png" media="(prefers-color-scheme: dark)">
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="mavr-iu">

  <!-- ==================== CABECERA ==================== -->
  <header>
    <div class="corporativo">
      <img src="img/logo-oscuro.png" alt="Logo de Sara Monzó">
      <h1>smf | interfaz integrada</h1>
    </div>
    <div id="herramientas">
      <input id="buscador" type="search" placeholder="Buscar en Clientes…" title="Ctrl + K">
      <button id="nuevo" type="button" title="Alt + N">+ Nuevo</button>
    </div>
    <button class="mv-tema" type="button" data-cambiar-tema><svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <div id="usuario">
      <div class="imagen">SM</div>
      <div>
        <p>Sara Monzó Fuentes</p>
        <a href="login.html">Cerrar sesión</a>
      </div>
    </div>
  </header>

  <!-- ==================== CUERPO: 3 COLUMNAS ==================== -->
  <main>
    <nav id="navegacion" aria-label="Módulos">
      <div class="titulo-columna">Módulos</div>
      <div class="contenido-columna"></div>
      <button class="minimizar" type="button" title="Minimizar">◀</button>
    </nav>
    <div class="separador" title="Arrastra para redimensionar"></div>

    <section id="entidades" aria-label="Vistas">
      <div class="titulo-columna">Vistas</div>
      <div class="contenido-columna"></div>
      <button class="minimizar" type="button" title="Minimizar">◀</button>
    </section>
    <div class="separador" title="Arrastra para redimensionar"></div>

    <div id="escenario" class="escenario"></div>
  </main>

  <!-- ==================== PIE: BARRA DE ESTADO ==================== -->
  <footer id="estado">
    <span id="estadoModulo">Clientes</span>
    <span id="estadoVista">Listado</span>
    <span id="estadoRegistros"></span>
    <span id="estadoEvento" class="mv-pie-evento">Listo</span>
    <span id="estadoConexion" class="mv-pie-conexion">● En línea</span>
  </footer>

  <!-- ==================== COMPONENTES FLOTANTES ==================== -->
  <div class="mv-drawer-overlay" id="mvDrawerOverlay" aria-hidden="true"></div>
  <aside class="mv-drawer" id="mvDrawer" aria-hidden="true" aria-label="Editor lateral">
    <div class="mv-drawer-resizer" id="mvDrawerResizer" title="Arrastra para redimensionar"></div>
    <header class="mv-drawer-header">
      <div>
        <small id="mvDrawerModo">CREAR</small>
        <h2 id="mvDrawerTitulo">Nuevo registro</h2>
      </div>
      <button class="mv-drawer-cerrar" id="mvDrawerCerrar" type="button" aria-label="Cerrar">×</button>
    </header>
    <div class="mv-drawer-body" id="mvDrawerCuerpo"></div>
  </aside>

  <div class="mv-modal-capa" id="mvModal" aria-hidden="true">
    <div class="mv-modal-fondo" data-modal-cerrar></div>
    <section class="mv-modal-ventana" role="dialog" aria-modal="true" aria-labelledby="mvModalTitulo">
      <header class="mv-modal-header">
        <h2 id="mvModalTitulo">Ventana modal</h2>
        <button class="mv-modal-cerrar" type="button" data-modal-cerrar aria-label="Cerrar">×</button>
      </header>
      <div class="mv-modal-body" id="mvModalCuerpo"></div>
    </section>
  </div>

  <div class="mv-toast-pila" id="mvToasts" aria-live="polite"></div>

  <!-- ==================== UD2 · ASISTENTE (interfaces naturales) ==================== -->
  <section class="mv-asistente" id="mvAsistente" aria-label="Asistente de inteligencia artificial">
    <div class="mv-asistente-barra" id="mvAsistenteBarra" title="Arrastra para mover">
      <span class="mv-asistente-chispa">✦</span>
      <span>Asistente local</span>
      <button class="mv-asistente-minimizar" id="mvAsistenteMinimizar" type="button" title="Minimizar" aria-label="Minimizar">—</button>
    </div>
    <div class="mv-asistente-redactar">
      <textarea id="mvAsistenteEntrada" rows="1" placeholder="Escribe o dicta lo que necesitas…"></textarea>
      <button class="mv-asistente-micro" id="mvAsistenteMicro" type="button" title="Entrada por voz" aria-label="Entrada por voz">🎤</button>
      <button class="mv-asistente-enviar" id="mvAsistenteEnviar" type="button" title="Enviar (Intro)" aria-label="Enviar">➜</button>
    </div>
    <div class="mv-asistente-opciones">
      <label class="mv-interruptor" title="Leer en voz alta la respuesta">
        <input id="mvAsistenteHablar" type="checkbox">
        <span class="mv-interruptor-pista"><span class="mv-interruptor-boton"></span></span>
        <span>Hablar respuesta</span>
      </label>
      <span class="mv-asistente-estado" id="mvAsistenteEstado" aria-live="polite"></span>
    </div>
    <div class="mv-asistente-redimensionar" id="mvAsistenteRedimensionar" title="Arrastra para redimensionar"></div>
  </section>

  <!-- Los <template> se cargan desde la carpeta templates/ (componentes externos) -->
  <script src="js/componentes.js"></script>
</body>
</html>
