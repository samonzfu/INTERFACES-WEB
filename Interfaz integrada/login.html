<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>smf | login</title>
  <link rel="icon" href="img/logo-claro.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="img/logo-oscuro.png" type="image/png" media="(prefers-color-scheme: dark)">
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="mv-login-pagina">
  <button class="mv-tema mv-tema-flotante" type="button" data-cambiar-tema><svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <main class="mv-login">
    <article class="mv-login-marca">
      <img src="img/logo-oscuro.png" alt="Logo de Sara Monzó">
      <h1>smf | interfaz integrada</h1>
      <p>Accede a tu espacio de trabajo.</p>
    </article>
    <article class="mv-login-tarjeta">
      <h2>Iniciar sesión</h2>
      <p>Introduce tus credenciales.</p>
      <form class="mv-form" action="index.html">
        <label class="mv-form-completo">
          <span>Email</span>
          <input type="email" required placeholder="nombre@ejemplo.com" autocomplete="username">
        </label>
        <label class="mv-form-completo">
          <span>Contraseña</span>
          <input type="password" required placeholder="••••••••" autocomplete="current-password">
        </label>
        <label class="mv-check mv-form-completo">
          <input type="checkbox">
          <span>Mantener la sesión iniciada</span>
        </label>
        <div class="mv-form-completo mv-login-acciones">
          <button class="mv-btn" type="submit">Entrar</button>
          <a class="mv-enlace" href="#">¿Olvidaste la contraseña?</a>
        </div>
      </form>
    </article>
  </main>
</body>
</html>
